{% extends "base.html" %}
{% block title %}{{ meta.title }} · Kolimn's Blog{% endblock %}
{% block content %}
<article class="article-detail">
    <a href="{{ url_for('index') }}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回首页
    </a>
    <h1>{{ meta.title }}</h1>
    <div class="article-meta">
        {% if meta.date %}<span>{{ meta.date }}</span><span class="dot"></span>{% endif %}
        {% for c in nav_categories if c.slug == meta.category %}
        <a href="{{ url_for('category', slug=c.slug) }}" class="meta-category">{{ c.name }}</a>
        {% endfor %}
    </div>
    <div class="content">
        {{ content|safe }}
    </div>
</article>
{% endblock %}
